<!doctype html>
<html lang="ja">
		<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>電子情報SPツール — ブラックジャック</title>
		<meta name="description" content="電子情報科SPコース向けの個人用ツール。ブラックジャック練習用のリッチな UI を提供します。" />
		<link rel="stylesheet" href="style.css" />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
		<!-- AOS for simple scroll animations -->
		<link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
	</head>
	<body>
			<header class="site-header">
				<div class="container header-inner">
					<a class="brand" href="#">電子情報SPツール</a>
					<nav class="main-nav">
						<a href="#hero">ホーム</a>
						<a href="#features">機能</a>
						<a href="#gallery">ギャラリー</a>
						<a href="#blackjack">ブラックジャック</a>
					</nav>
					<div class="controls">
						<button id="menu-toggle" class="menu-toggle" aria-label="Toggle menu">☰</button>
					</div>
				</div>
			</header>

		<main>
			<section id="hero" class="hero">
				<div class="hero-bg"></div>
							<div class="container hero-inner">
								<h1 class="hero-title" data-aos="fade-up">電子情報SPコース用ツール</h1>
								<p class="hero-sub" data-aos="fade-up" data-aos-delay="150">ブラックジャック学習用のリッチなインターフェースを提供します。見た目・挙動・音にこだわりました。</p>
								<div class="hero-cta" data-aos="zoom-in" data-aos-delay="300">
									<a class="btn primary" href="#blackjack">ブラックジャックを始める</a>
								</div>
							</div>
				<div class="hero-shapes" aria-hidden="true">
					<span class="shape s1"></span>
					<span class="shape s2"></span>
					<span class="shape s3"></span>
				</div>
			</section>

					<!-- Removed other sections to focus on Blackjack tool -->
					<!-- Calculator section -->
							<!-- Blackjack section -->
							<section id="blackjack" class="container tool-section" data-aos="fade-up">
								<h2>ブラックジャック</h2>
								<p>プレイヤー対ディーラーのブラックジャック。見た目にこだわった UI で練習できます。</p>
								<div class="bj-area">
									<div class="dealer panel">
										<h3>ディーラー</h3>
										<div id="dealer-cards" class="card-row"></div>
										<div class="score" id="dealer-score">--</div>
									</div>
									<div class="player panel">
										<h3>プレイヤー</h3>
										<div id="player-cards" class="card-row"></div>
										<div class="score" id="player-score">--</div>
									</div>
								</div>
								<div class="bj-controls">
									<button id="bj-new" class="btn primary">新しいゲーム</button>
									<button id="bj-hit" class="btn">ヒット</button>
									<button id="bj-stand" class="btn ghost">スタンド</button>
								</div>
								<div id="bj-log" class="bj-log" aria-live="polite"></div>
							</section>
		</main>

		<footer class="site-footer">
			<div class="container">© <span id="year"></span> WADO Support — Demo</div>
		</footer>

		<!-- Modal for gallery -->
		<div id="modal" class="modal" aria-hidden="true">
			<div class="modal-inner" role="dialog" aria-modal="true">
				<button class="modal-close" aria-label="Close">✕</button>
				<img id="modal-img" src="" alt="" />
			</div>
		</div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
		<script src="script.js"></script>
	</body>
</html>
